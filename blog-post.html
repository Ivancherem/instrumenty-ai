<script>
const articles = [
{id:1,icon:"🤖",date:"27 марта 2026",title:"Как ИИ меняет образование",content:`<p><strong>Искусственный интеллект в образовании</strong></p><p>Искусственный интеллект (ИИ) стремительно меняет подходы к обучению. Сегодня мы видим, как технологии помогают создавать персонализированные образовательные траектории, автоматизировать рутинные задачи преподавателей и делать обучение более увлекательным.</p><h3>Персонализация обучения</h3><p>Главное преимущество ИИ в образовании — возможность адаптировать учебный материал под каждого ученика. Системы на основе ИИ анализируют успеваемость, определяют слабые места и предлагают индивидуальные задания.</p><div class="task-block"><h4>📝 Практическое задание</h4><p>Представьте, что вы учитель. Опишите, как бы вы использовали ИИ для помощи ученику, который отстает по математике.</p><textarea id="answerField" placeholder="Напишите свой ответ здесь..."></textarea><br><br><button onclick="saveAnswer()">💾 Сохранить ответ</button><div id="saveStatus" class="save-status"></div></div><div class="task-block"><h4>❓ Вопрос для самопроверки</h4><p><strong>Что является главным преимуществом ИИ в образовании?</strong></p><div id="quizOptions"><div class="quiz-option" onclick="selectAnswer(0)">А) Автоматическая проверка тестов</div><div class="quiz-option" onclick="selectAnswer(1)">Б) Адаптация материала под ученика</div><div class="quiz-option" onclick="selectAnswer(2)">В) Создание презентаций</div><div class="quiz-option" onclick="selectAnswer(3)">Г) Видео-уроки</div></div><div id="quizResult" style="margin-top:10px;font-weight:bold;"></div></div>`},
{id:2,icon:"📚",date:"25 марта 2026",title:"5 методов эффективного обучения",content:`<p><strong>5 методов эффективного обучения</strong></p><p>В этой статье мы рассмотрим научно доказанные техники, которые помогут вам учиться быстрее и запоминать больше информации.</p><h3>1. Метод интервального повторения</h3><p>Повторяйте материал через определенные промежутки времени, чтобы закрепить знания в долговременной памяти.</p><h3>2. Активное воспроизведение</h3><p>Вместо пассивного чтения, старайтесь вспоминать информацию без подсказок.</p><h3>3. Метод Фейнмана</h3><p>Объясняйте сложные концепции простыми словами, как будто учите кого-то другого.</p><h3>4. Чередование тем</h3><p>Переключайтесь между разными темами, чтобы улучшить понимание и запоминание.</p><h3>5. Практическое применение</h3><p>Сразу применяйте полученные знания на практике, чтобы закрепить материал.</p>`},
{id:3,icon:"🎓",date:"22 марта 2026",title:"Подготовка к экзаменам: пошаговый план",content:`<p><strong>Подготовка к экзаменам: пошаговый план</strong></p><p>Успешная подготовка к экзаменам — это не просто зубрежка, а системный подход. Вот план, который поможет вам сдать экзамены на отлично.</p><h3>Шаг 1: Составьте расписание</h3><p>Разбейте материал на небольшие блоки и распределите их по дням.</p><h3>Шаг 2: Используйте активное повторение</h3><p>Вместо пассивного чтения, старайтесь пересказывать материал своими словами.</p><h3>Шаг 3: Делайте перерывы</h3><p>Каждые 45-50 минут делайте 10-15 минут перерыва.</p><h3>Шаг 4: Практические задания</h3><p>Решайте примеры, задачи и тесты.</p><h3>Шаг 5: Сон и питание</h3><p>Не забывайте про полноценный сон и правильное питание.</p>`},
{id:4,icon:"💻",date:"20 марта 2026",title:"Лучшие бесплатные образовательные ресурсы",content:`<p><strong>Лучшие бесплатные образовательные ресурсы</strong></p><p>В интернете есть множество бесплатных ресурсов для самообразования:</p><h3>1. Coursera</h3><p>Бесплатные курсы от ведущих университетов мира.</p><h3>2. Stepik</h3><p>Российская платформа с курсами по программированию и математике.</p><h3>3. Khan Academy</h3><p>Бесплатные уроки по математике, науке, истории.</p><h3>4. Яндекс.Практикум</h3><p>Бесплатные уроки по программированию и аналитике.</p><h3>5. Лекториум</h3><p>Лекции ведущих российских ученых.</p>`},
{id:5,icon:"🧠",date:"18 марта 2026",title:"Нейропластичность: как мозг учится",content:`<p><strong>Нейропластичность: как мозг учится</strong></p><p>Нейропластичность — это способность мозга изменяться и адаптироваться. Благодаря этому мы можем учиться новому на протяжении всей жизни.</p><h3>Как работает нейропластичность</h3><p>Мозг состоит из нейронов, которые соединяются друг с другом через синапсы. Когда мы учимся, эти связи укрепляются.</p><h3>Как улучшить нейропластичность</h3><p>1. Регулярно учитесь новому.</p><p>2. Занимайтесь физической активностью.</p><p>3. Медитируйте.</p><p>4. Спите достаточно.</p>`},
{id:6,icon:"🎯",date:"15 марта 2026",title:"Как не прокрастинировать: рабочие техники",content:`<p><strong>Как не прокрастинировать: рабочие техники</strong></p><p>Прокрастинация — это проблема, с которой сталкивается каждый. Вот несколько техник, которые помогут начать действовать.</p><h3>1. Правило 5 минут</h3><p>Скажите себе, что поработаете всего 5 минут.</p><h3>2. Метод Pomodoro</h3><p>Работайте 25 минут, затем делайте 5 минут перерыва.</p><h3>3. Разбейте задачу на части</h3><p>Большие задачи пугают. Разделите их на маленькие шаги.</p><h3>4. Уберите отвлекающие факторы</h3><p>Выключите уведомления, уберите телефон.</p><h3>5. Награждайте себя</h3><p>После выполнения задачи поощряйте себя.</p>`}
];
const correctAnswerIndex = 1;
let selectedAnswerIndex = null;
function getArticleId(){const p=new URLSearchParams(window.location.search);return parseInt(p.get('id'));}
function saveAnswer(){const f=document.getElementById('answerField'),s=document.getElementById('saveStatus'),a=f.value.trim();if(!a){s.textContent='❌ Напишите ответ.';s.className='save-status error';return;}localStorage.setItem('savedAnswer_'+getArticleId(),a);s.textContent='✅ Сохранено!';s.className='save-status success';}
function selectAnswer(i){selectedAnswerIndex=i;document.querySelectorAll('.quiz-option').forEach((el,idx)=>{el.classList.remove('selected','correct','wrong');if(idx===i)el.classList.add('selected');});const r=document.getElementById('quizResult');if(i===correctAnswerIndex){r.innerHTML='✅ Правильно! Адаптация материала под ученика — это главное преимущество ИИ.';r.style.color='#28a745';}else{r.innerHTML='❌ Попробуйте еще раз.';r.style.color='#dc3545';}}
function renderArticle(){const id=getArticleId();const a=articles.find(x=>x.id===id);const c=document.getElementById('articleContainer');if(!a){c.innerHTML='<p>Статья не найдена. <a href="blog.html">Вернуться</a></p>';return;}c.innerHTML='<h1>'+a.icon+' '+a.title+'</h1><p class="article-date">'+a.date+'</p><div class="article-content">'+a.content+'</div>';const saved=localStorage.getItem('savedAnswer_'+id);if(saved){const f=document.getElementById('answerField'),s=document.getElementById('saveStatus');if(f){f.value=saved;s.textContent='📂 Загружено';s.className='save-status success';}}}
renderArticle();
</script>
