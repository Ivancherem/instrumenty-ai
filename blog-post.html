<!DOCTYPE html>
<html lang="ru">
<head>

</head>
<body>
    <header>
        <nav>
            <div class="logo"><a href="index.html">📚 Instrumenty-AI</a></div>
            <ul>
                <li><a href="index.html">Главная</a></li>
                <li><a href="tools.html">Инструменты</a></li>
                <li><a href="blog.html">Блог</a></li>
                <li><a href="courses.html">Курсы</a></li>

                <li><a href="about.html">О проекте</a></li>
                <li><a href="contacts.html">Контакты</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="articleContainer"><p>Загрузка статьи...</p></div>
        <a href="blog.html">← Вернуться к списку</a>
    </main>
    <footer><p>&copy; 2026 Instrumenty-AI. Образовательный портал.</p></footer>
    <script>
        const articles = [
            { id: 1, icon: "🤖", date: "27 марта 2026", title: "Как ИИ меняет образование", content: "<p>ИИ меняет образование...</p>" },
            { id: 2, icon: "📚", date: "25 марта 2026", title: "5 методов эффективного обучения", content: "<p>5 методов...</p>" },
            { id: 3, icon: "🎓", date: "22 марта 2026", title: "Подготовка к экзаменам", content: "<p>Подготовка...</p>" },
            { id: 4, icon: "💻", date: "20 марта 2026", title: "Лучшие бесплатные ресурсы", content: "<p>Ресурсы...</p>" },
            { id: 5, icon: "🧠", date: "18 марта 2026", title: "Нейропластичность", content: "<p>Нейропластичность...</p>" },
            { id: 6, icon: "🎯", date: "15 марта 2026", title: "Как не прокрастинировать", content: "<p>Прокрастинация...</p>" }
        ];
        const id = new URLSearchParams(window.location.search).get('id');
        const article = articles.find(a => a.id == id);
        const container = document.getElementById('articleContainer');
        if (article) {
            container.innerHTML = `<h1>${article.icon} ${article.title}</h1><p>${article.date}</p><div>${article.content}</div>`;
        } else {
            container.innerHTML = '<p>Статья не найдена.</p>';
        }
    </script>
</body>
</html>
