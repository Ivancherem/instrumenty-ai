const correctAnswers = {1: 1};

function saveAnswer(articleId) {
    const field = document.getElementById('answerField' + articleId);
    const status = document.getElementById('saveStatus' + articleId);
    if (!field) return;
    const answer = field.value.trim();
    if (!answer) {
        status.textContent = '❌ Напишите ответ.';
        status.className = 'save-status error';
        return;
    }
    localStorage.setItem('savedAnswer_' + articleId, answer);
    status.textContent = '✅ Сохранено!';
    status.className = 'save-status success';
}

function selectAnswer(articleId, index) {
    const options = document.querySelectorAll('#quizOptions' + articleId + ' .quiz-option');
    options.forEach((el, i) => {
        el.classList.remove('selected', 'correct', 'wrong');
        if (i === index) el.classList.add('selected');
    });
    const result = document.getElementById('quizResult' + articleId);
    if (index === correctAnswers[articleId]) {
        result.innerHTML = '✅ Правильно! Адаптация материала под ученика — это главное преимущество ИИ.';
        result.style.color = '#28a745';
    } else {
        result.innerHTML = '❌ Попробуйте еще раз.';
        result.style.color = '#dc3545';
    }
}

function renderBlog() {
    const container = document.getElementById('blogContainer');
    container.innerHTML = articles.map(a => `
        <div class="article-card">
            <h2>${a.icon} ${a.title}</h2>
            <div class="article-date">${a.date}</div>
            <div class="article-content">${a.content}</div>
        </div>
        <hr>
    `).join('');
    
    // Восстанавливаем сохранённые ответы
    articles.forEach(a => {
        const saved = localStorage.getItem('savedAnswer_' + a.id);
        if (saved) {
            const field = document.getElementById('answerField' + a.id);
            const status = document.getElementById('saveStatus' + a.id);
            if (field) {
                field.value = saved;
                status.textContent = '📂 Загружено';
                status.className = 'save-status success';
            }
        }
    });
}
renderBlog();
